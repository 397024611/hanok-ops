<script>

const SB_KEY="sb_publishable_gzlaNquJPCOsgVMb1ZhRdw_X38GSi6s";

const CATEGORIES=["Maintenance","Supplier / Stock","IT / POS","Marketing","HR / Staff","Finance","Landlord / Centre","Health & Safety","Other"];
const SESSION_KEY="hanok_store_session", PAGE_SIZE=150, MAX_FILE_SIZE=52428800;
let session=null,profile=null,store=null,assignedStores=[],tickets=[],filter="open",timer=null;
let loginMode="shared",accessPromise=null,scopeEpoch=0,scopeController=new AbortController(),attachmentDrafts=new Map();

try{const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(saved?.access_token&&saved?.refresh_token&&saved?.user?.id)session=saved;else localStorage.removeItem(SESSION_KEY)}catch{try{localStorage.removeItem(SESSION_KEY)}catch{}}
function persistSession(){try{if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));else localStorage.removeItem(SESSION_KEY)}catch{/* Private browsing may disable storage; the current session still works. */}}
function cancelled(){return new DOMException("This screen is no longer active.","AbortError")}
function active(epoch){return epoch===authEpoch&&!!session}
function currentScope(epoch,scope){return active(epoch)&&scope===scopeEpoch}
function isCurrent(v){return view===v&&currentScope(v.epoch,v.scope)}
function canReport(){return profile?.role==="store"&&!!store}
function loading(){const epoch=authEpoch;loadingCount++;document.getElementById("loading").classList.add("show");return()=>{if(epoch!==authEpoch)return;loadingCount=Math.max(0,loadingCount-1);document.getElementById("loading").classList.toggle("show",loadingCount>0)}}
function toast(t){const x=document.getElementById("toast");clearTimeout(toastTimer);x.textContent=t;x.classList.add("show");toastTimer=setTimeout(()=>x.classList.remove("show"),5000)}
function h(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(s){const d=new Date(s);return s&&Number.isFinite(d.getTime())?new Intl.DateTimeFormat("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).format(d):"-"}
function age(s){const d=new Date(s).getTime();if(!Number.isFinite(d))return"-";const m=Math.max(0,(Date.now()-d)/60000);return m<2?"Just now":m<60?Math.floor(m)+"m ago":m<1440?Math.floor(m/60)+"h ago":Math.floor(m/1440)+"d ago"}
function statusLabel(s){return({new:"New",accepted:"Accepted",in_progress:"In Progress",waiting:"Waiting",completed:"Completed"})[s]||s||"Unknown"}
function cls(t){return t.priority==="urgent"&&t.status!=="completed"?"red":t.status==="waiting"?"gold":t.status==="completed"?"green":"blue"}
function internalEmail(code){return"store."+code.toLowerCase()+"@hanokops.invalid"}
async function errorFor(r){let j={};try{j=await r.json()}catch{}const e=new Error(j.message||j.error_description||j.error||j.details||"Request failed ("+r.status+").");e.status=r.status;e.code=j.code;return e}
// Refresh-token rotation must be single-flight. A request retries authorization once only.
async function refresh(){
  if(refreshPromise)return refreshPromise;
  if(!session?.refresh_token)throw new Error("Please sign in again.");
  const epoch=authEpoch,token=session.refresh_token;
  const pending=(async()=>{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",signal:AbortSignal.any([authController.signal,AbortSignal.timeout(30000)]),headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:token})});
    if(!active(epoch))throw cancelled();
    if(!r.ok){const e=await errorFor(r);if([400,401,403].includes(r.status)){logout(false);toast("Your session expired. Please sign in again.")}throw e}
    const next=await r.json();if(!active(epoch))throw cancelled();
    if(!next?.access_token||!next?.refresh_token||!next?.user?.id)throw new Error("Could not renew the session. Please sign in again.");
    session=next;persistSession();return true;
  })();
  refreshPromise=pending;
  try{return await pending}finally{if(refreshPromise===pending)refreshPromise=null}
}
async function request(path,opts={}){
  const epoch=authEpoch,signal=AbortSignal.any([authController.signal,AbortSignal.timeout(opts.body instanceof File?300000:30000),...(opts.signal?[opts.signal]:[])]);
  for(let attempt=0;attempt<2;attempt++){
    if(!active(epoch)||signal.aborted)throw cancelled();
    const token=session.access_token;
    const r=await fetch(SB_URL+path,{...opts,signal,headers:{apikey:SB_KEY,...(opts.headers||{}),Authorization:"Bearer "+token}});
    if(!active(epoch)||signal.aborted)throw cancelled();
    if(r.status===401){
      if(attempt===1){logout(false);toast("Please sign in again.");throw new Error("Your session is no longer authorized.")}
      // A parallel request may already have refreshed this token.
      if(session.access_token===token)await refresh();
      continue;
    }
    if(!r.ok)throw await errorFor(r);
    return r;
  }
}
async function api(path,opts={}){const r=await request(path,opts);if(r.status===204)return null;const text=await r.text();return text?JSON.parse(text):null}
// Stable client IDs allow a retry to reconcile a committed write after a lost response.
async function insertOnce(table,payload,opts={}){
  try{const rows=await api("/rest/v1/"+table,{...opts,method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(payload)});if(rows?.[0])return rows[0];throw new Error("No confirmation received. Retry to check this submission.")}
  catch(e){if(e.name==="AbortError"||!session)throw e;try{const rows=await api("/rest/v1/"+table+"?id=eq."+encodeURIComponent(payload.id)+"&select=*",opts);if(rows?.[0])return rows[0]}catch{}throw e}
}
function loginPage(message=""){
  const independent=loginMode==="independent";
  app.innerHTML='<div class="login"><div class="loginWrap"><div class="eyebrow">STORE & PARTNER PORTAL</div><div class="brand">报告老板</div><div class="tag">Report issues. Track progress. Stay informed.</div><form class="loginCard" onsubmit="event.preventDefault();login()"><h2>'+(independent?'Individual sign in':'Store sign in')+'</h2><div class="tabs" aria-label="Sign-in method"><button type="button" id="sharedLogin" class="'+(!independent?'active':'')+'" aria-pressed="'+!independent+'" onclick="setLoginMode(\'shared\')">Shared store</button><button type="button" id="independentLogin" class="'+(independent?'active':'')+'" aria-pressed="'+independent+'" onclick="setLoginMode(\'independent\')">Staff / Partner</button></div><p>'+(independent?'Use the individual email and password provided by your administrator.':'Select your store and enter the store password.')+'</p>'+(independent?'<label class="field" for="email">EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="Your email" required>':'<label class="field" for="storeSel">STORE / USERNAME</label><select id="storeSel" autocomplete="username">'+STORES.map(s=>'<option value="'+h(s.code)+'">'+h(s.name)+'</option>').join("")+'</select>')+'<label class="field" for="pwd">PASSWORD</label><input id="pwd" type="password" autocomplete="current-password" placeholder="'+(independent?'Your password':'Store password')+'" required><div id="err" class="error" role="alert">'+h(message)+'</div><button class="primary" id="loginSubmit" type="submit">Sign in</button></form><div class="loginFoot">Hanok Group  -  Internal Operations</div></div></div>';
}
function setLoginMode(mode){if(loginBusy||!["shared","independent"].includes(mode)||mode===loginMode)return;loginMode=mode;loginPage();document.getElementById(mode==="independent"?"email":"storeSel")?.focus()}
async function login(){
  if(loginBusy)return;
  const email=loginMode==="independent"?document.getElementById("email").value.trim():internalEmail(document.getElementById("storeSel").value),password=document.getElementById("pwd").value,out=document.getElementById("err");
  out.textContent="";if(!email||!password){out.textContent="Enter your email or store and password.";return}
  loginBusy=true;const epoch=authEpoch,done=loading();for(const id of ["loginSubmit","sharedLogin","independentLogin"])document.getElementById(id).disabled=true;
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",signal:AbortSignal.any([authController.signal,AbortSignal.timeout(30000)]),headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    if(epoch!==authEpoch)throw cancelled();if(!r.ok)throw new Error(r.status===400||r.status===401?"Incorrect email, store or password.":"Sign in is unavailable. Please try again.");
    const next=await r.json();if(epoch!==authEpoch)throw cancelled();if(!next?.access_token||!next?.refresh_token||!next?.user?.id)throw new Error("Invalid sign-in response.");
    session=next;persistSession();document.getElementById("pwd").value="";await boot();
  }catch(e){if(epoch===authEpoch&&e.name!=="AbortError")out.textContent=e.message}
  finally{if(epoch===authEpoch){loginBusy=false;for(const id of ["loginSubmit","sharedLogin","independentLogin"]){const button=document.getElementById(id);if(button)button.disabled=false}}done()}
}
// A store context owns every operational read and write. Switching invalidates it before rendering.
function clearStoreContext(){
  scopeEpoch++;scopeController.abort();scopeController=new AbortController();listSequence++;listBusy=false;
  closeOverlay();tickets=[];draft=null;attachmentDrafts.clear();filter="open";syncError=false;
  clearTimeout(toastTimer);document.getElementById("toast").classList.remove("show");
}
function logout(revoke=true){
  const token=session?.access_token;authEpoch++;authController.abort();authController=new AbortController();refreshPromise=null;accessPromise=null;
  clearInterval(timer);timer=null;loginBusy=false;loadingCount=0;document.getElementById("loading").classList.remove("show");
  clearStoreContext();session=null;profile=null;store=null;assignedStores=[];persistSession();loginPage();
  if(revoke&&token)fetch(SB_URL+"/auth/v1/logout?scope=local",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+token},signal:AbortSignal.timeout(10000)}).catch(()=>{});
}
function accountError(message){return Object.assign(new Error(message),{invalidAccount:true})}
async function refreshAccess(){
  if(accessPromise)return accessPromise;
  const epoch=authEpoch;
  const pending=(async()=>{
    const ps=await api("/rest/v1/ops_profiles?user_id=eq."+encodeURIComponent(session.user.id)+"&select=user_id,display_name,role,store_id,active");if(!active(epoch))throw cancelled();
    const next=ps?.[0];
    if(!next||next.user_id!==session.user.id||next.active===false||!["store","partner"].includes(next.role))throw accountError("This account is inactive or cannot use the store portal. Please contact your administrator.");
    if(next.role==="store"&&!next.store_id)throw accountError("This account is not assigned to a store. Please contact your administrator.");
    // RLS restricts this list to current memberships, including for legacy shared accounts.
    const ss=await api("/rest/v1/ops_stores?active=eq.true"+(next.role==="store"?"&id=eq."+encodeURIComponent(next.store_id):"")+"&select=id,code,name,active&order=name.asc");if(!active(epoch))throw cancelled();
    const allowed=(ss||[]).filter(s=>s.active===true&&(next.role!=="store"||s.id===next.store_id));
    if(!allowed.length)throw accountError("No active stores are assigned to this account. Please contact your administrator.");
    const selected=allowed.find(s=>s.id===store?.id)||allowed[0];
    const changed=store?.id!==selected.id||(profile&&profile.role!==next.role);
    if(changed)clearStoreContext();
    profile=next;assignedStores=allowed;store=selected;if(changed)render();return true;
  })();accessPromise=pending;
  try{return await pending}catch(e){if(active(epoch)&&(e.invalidAccount||e.status===403)){logout(false);loginPage(e.invalidAccount?e.message:"Your access has changed. Please sign in again.")}throw e}
  finally{if(accessPromise===pending)accessPromise=null}
}
async function boot(){
  if(!session){loginPage();return}
  const epoch=authEpoch,done=loading();
  try{
    await refreshAccess();if(!active(epoch))return;render();await loadTickets(false,true);if(!active(epoch))return;
    clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState!=="hidden")loadTickets(true)},10000);
  }catch(e){if(active(epoch)&&e.name!=="AbortError")app.innerHTML='<div class="login"><div class="loginWrap"><div class="loginCard"><h2>Could not load your store</h2><p role="alert">'+h(e.message)+'</p><button class="primary" onclick="boot()">Retry connection</button><button class="secondary" onclick="logout()">Sign out</button></div></div></div>'}finally{done()}
}
async function switchStore(id){
  if(!session||profile?.role!=="partner"||id===store?.id)return;
  const selected=assignedStores.find(s=>s.id===id);if(!selected)return;
  clearStoreContext();store=selected;render();await loadTickets();
}
async function loadTickets(silent=false,accessChecked=false){
  if(!session||!store||(silent&&listBusy))return;
  const epoch=authEpoch;
  try{if(!accessChecked)await refreshAccess()}catch(e){if(active(epoch)&&e.name!=="AbortError"){syncError=true;render();if(!silent)toast("Could not verify store access. Please retry.")}return}
  if(!active(epoch)||!store)return;
  const sequence=++listSequence,scope=scopeEpoch,storeId=store.id,signal=scopeController.signal;listBusy=true;
  try{
    const rows=[];let page;
    do{page=await api("/rest/v1/ops_tickets?store_id=eq."+encodeURIComponent(storeId)+"&select=id,store_id,ticket_no,title,description,reported_by,category,priority,status,due_at,follow_up_at,waiting_reason,resolution,created_at,updated_at&order=created_at.desc,id.desc&limit="+PAGE_SIZE+"&offset="+rows.length,{signal});if(!currentScope(epoch,scope)||sequence!==listSequence)return;rows.push(...(page||[]))}while(page?.length===PAGE_SIZE);
    tickets=[...new Map(rows.filter(t=>t.store_id===storeId).map(t=>[t.id,t])).values()];syncError=false;render();
    const v=view;if(v?.kind==="detail"&&isCurrent(v)){const t=tickets.find(t=>t.id===v.id);if(t){document.getElementById("ticketSummary").innerHTML=ticketSummary(t);refreshDetail(v)}else closeOverlay()}
  }catch(e){if(currentScope(epoch,scope)&&sequence===listSequence&&e.name!=="AbortError"){syncError=true;render();if(!silent)toast("Could not refresh tickets. "+e.message)}}finally{if(sequence===listSequence)listBusy=false}
}
function card(t){return '<button type="button" class="card ticket" data-ticket="'+h(t.id)+'"><span class="row between"><span class="row"><span class="pill '+cls(t)+'">'+h(t.priority==="urgent"&&t.status!=="completed"?"Urgent":statusLabel(t.status))+'</span><span class="ticketNo">'+h(store.code)+'-'+String(t.ticket_no||0).padStart(5,"0")+'</span></span><span class="age">'+age(t.created_at)+'</span></span><h3>'+h(t.title)+'</h3><p>'+h(t.description||t.category)+'</p><span class="chev" aria-hidden="true">&gt;</span></button>'}
function render(){
  if(!session||!store)return;
  let arr=tickets.filter(t=>filter==="open"?t.status!=="completed":t.status===filter);
  const focused=document.activeElement?.dataset.ticket||null,selectorFocused=document.activeElement?.id==="assignedStore";
  app.innerHTML='<div class="shell"><div class="top"><div class="topInner"><div class="topRow"><div><div class="storeName">'+h(store.name)+'</div><div class="portalTag">报告老板  -  STORE PORTAL</div></div><button class="logout" onclick="logout()">Sign out</button></div><div class="hello">'+(profile.role==="partner"?"Partner overview":"Store operations")+'</div><div class="sub">'+(profile.role==="partner"?"View assigned stores and follow up with comments and photos.":"Report an issue and track HQ progress here.")+'</div>'+(profile.role==="partner"?'<label class="field" for="assignedStore">ASSIGNED STORE</label><select id="assignedStore" class="storeSelect">'+assignedStores.map(s=>'<option value="'+h(s.id)+'"'+(s.id===store.id?' selected':'')+'>'+h(s.name)+'</option>').join("")+'</select>':'')+'<div class="sync" role="status"><i'+(syncError?' style="background:#c78c38"':'')+'></i> '+(syncError?'Refresh failed. Retrying every 10s.':'Connected  -  auto-sync every 10s')+'</div></div></div><main class="main">'+(canReport()?'<div class="report"><div><h2>Report an issue</h2><p>Maintenance, stock, IT, staff, landlord and more.</p></div><button class="plus" aria-label="Report an issue" onclick="newTicket()">+</button></div>':'')+'<div class="tabs" aria-label="Ticket filters">'+["open","waiting","completed"].map(x=>'<button aria-pressed="'+(filter===x)+'" class="'+(filter===x?"active":"")+'" onclick="filter=\''+x+'\';render()">'+x[0].toUpperCase()+x.slice(1)+'</button>').join("")+'</div><div class="sectionTitle">My Tickets</div>'+(arr.length?arr.map(card).join(""):'<div class="empty">'+(syncError?'Tickets could not be loaded.':'No tickets in this section.')+'</div>')+'</main></div>';
  const selector=document.getElementById("assignedStore");if(selector)selector.onchange=e=>switchStore(e.target.value);
  app.querySelectorAll("[data-ticket]").forEach(b=>b.onclick=()=>detail(b.dataset.ticket));
  if(selectorFocused&&!view)selector?.focus();
  if(focused&&!view)app.querySelector('[data-ticket="'+CSS.escape(focused)+'"]')?.focus();
}
function releaseView(){if(view){view.controller.abort();view.urls.forEach(u=>URL.revokeObjectURL(u))}view=null}
function openView(kind,id,title,html){
  if(!view)returnFocus=document.activeElement;
  releaseView();const v={kind,id,key:++viewSequence,epoch:authEpoch,scope:scopeEpoch,controller:new AbortController(),urls:new Set(),partsBusy:false,busy:false};view=v;
  app.inert=true;overlay.className="overlay show";overlay.setAttribute("role","dialog");overlay.setAttribute("aria-modal","true");overlay.setAttribute("aria-labelledby","overlayTitle");
  overlay.innerHTML='<div class="overlayTop"><button type="button" aria-label="Close" onclick="closeOverlay()">&lt;</button><b id="overlayTitle">'+h(title)+'</b><span aria-hidden="true"></span></div><div class="sheet"><div class="sheetInner">'+html+'</div></div>';
  overlay.querySelector("button")?.focus();return v;
}
function closeOverlay(){releaseView();overlay.className="overlay";overlay.innerHTML="";overlay.removeAttribute("role");overlay.removeAttribute("aria-modal");app.inert=false;if(returnFocus?.isConnected)returnFocus.focus();else app.querySelector(".plus")?.focus();returnFocus=null}
window.addEventListener("keydown",e=>{if(!view)return;if(e.key==="Escape"){e.preventDefault();closeOverlay()}else if(e.key==="Tab"){const els=[...overlay.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),video[controls]')].filter(el=>el.getClientRects().length);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener("storage",e=>{if(e.key===SESSION_KEY&&e.newValue===null&&session)logout(false)});
function newTicket(){
  if(!session||!canReport())return;
  if(!draft)draft={id:crypto.randomUUID(),title:"",description:"",reported_by:"",category:CATEGORIES[0],priority:"normal",file:null,created:null,busy:false,payload:null,attachmentId:crypto.randomUUID(),uploaded:false,error:""};
  const d=draft;
  openView("new",d.id,"Report Issue",'<form class="form detailCard" onsubmit="event.preventDefault();createTicket()"><fieldset id="ticketFields"><label for="reportedBy">Reported by</label><input id="reportedBy" maxlength="100" placeholder="Your name, e.g. Jack" value="'+h(d.reported_by)+'"><label for="cat">Category</label><select id="cat">'+CATEGORIES.map(x=>'<option'+(x===d.category?' selected':'')+'>'+x+'</option>').join("")+'</select><label for="title">Title</label><input id="title" required placeholder="What needs attention?" value="'+h(d.title)+'"><label for="desc">Description</label><textarea id="desc" placeholder="Tell HQ what happened and what you need.">'+h(d.description)+'</textarea><label for="pri">Priority</label><select id="pri"><option value="normal">Normal</option><option value="urgent"'+(d.priority==="urgent"?' selected':'')+'>Urgent</option></select><label for="file">Photo / Video (up to 50 MB)</label><input id="file" type="file" accept="image/*,video/*"><p id="fileName" class="formNote">'+h(d.file?.name||"")+'</p></fieldset><div id="submitStatus" role="status" class="formNote"></div><button id="submitTicket" class="primary" type="submit">Submit to HQ</button></form>');
  for(const [id,key] of Object.entries({title:"title",desc:"description",reportedBy:"reported_by",cat:"category",pri:"priority"})){document.getElementById(id).addEventListener("input",e=>{if(!d.payload)d[key]=e.target.value})}
  document.getElementById("file").onchange=e=>{if(d.payload)return;d.file=e.target.files[0]||null;document.getElementById("fileName").textContent=d.file?.name||""};
  updateDraftView(d);
}
function updateDraftView(d){if(view?.kind!=="new"||view.id!==d.id)return;document.getElementById("ticketFields").disabled=d.busy||!!d.payload;const button=document.getElementById("submitTicket");button.disabled=d.busy;button.textContent=d.busy?(d.created?"Uploading attachment...":"Submitting..."):d.created?"Retry attachment":d.payload?"Retry submission":"Submit to HQ";document.getElementById("submitStatus").textContent=d.error||(d.created?"Your ticket is already sent to HQ. Only the attachment remains.":d.busy?"Sending your issue to HQ...":"")}
async function upload(d,opts={}){
  const file=d.file;if(!file)return;
  const path=d.id+"/"+d.attachmentId+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  if(!d.uploaded){await request("/storage/v1/object/ops-ticket-attachments/"+path,{...opts,method:"POST",headers:{"Content-Type":file.type||"application/octet-stream","x-upsert":"true"},body:file});d.uploaded=true}
  await insertOnce("ops_ticket_attachments",{id:d.attachmentId,ticket_id:d.id,uploaded_by:d.payload.created_by,storage_path:path,file_name:file.name,mime_type:file.type,size_bytes:file.size},opts);
}
async function createTicket(){
  const d=draft;if(!d||d.busy||!session||!canReport())return;
  if(!d.title.trim()){toast("Add a title.");document.getElementById("title")?.focus();return}
  if(d.file&&(d.file.size>MAX_FILE_SIZE||!(/^(image|video)\//).test(d.file.type)||d.file.type.toLowerCase()==="image/svg+xml"||/\.svgz?$/i.test(d.file.name))){toast("Choose a photo or video up to 50 MB. SVG files are not supported.");return}
  const epoch=authEpoch,scope=scopeEpoch,signal=scopeController.signal;d.busy=true;d.error="";
  if(!d.payload)d.payload={id:d.id,store_id:store.id,created_by:session.user.id,title:d.title.trim(),description:d.description.trim(),reported_by:d.reported_by.trim()||null,category:d.category,priority:d.priority};
  updateDraftView(d);
  try{
    if(!d.created)d.created=await insertOnce("ops_tickets",d.payload,{signal});
    if(!currentScope(epoch,scope))return;updateDraftView(d);await upload(d,{signal});if(!currentScope(epoch,scope))return;
    if(draft===d)draft=null;if(view?.kind==="new"&&view.id===d.id)closeOverlay();await loadTickets();if(currentScope(epoch,scope))toast("Issue sent to HQ.");
  }catch(e){if(currentScope(epoch,scope)&&e.name!=="AbortError"){d.error=d.created?"Ticket sent to HQ, but the attachment is not complete. Retry attachment; no new ticket will be created. "+e.message:"Submission could not be confirmed. Retry safely to check or finish the same ticket. "+e.message;updateDraftView(d);toast(d.created?"Ticket sent. Attachment needs a retry.":"Could not confirm submission. Your draft is kept.");if(d.created)loadTickets(true)}}
  finally{d.busy=false;if(currentScope(epoch,scope))updateDraftView(d)}
}
function ticketSummary(t){return '<div class="row between"><span class="pill '+cls(t)+'">'+h(t.priority==="urgent"&&t.status!=="completed"?"Urgent":statusLabel(t.status))+'</span><span class="ticketNo">'+h(store.code)+'-'+String(t.ticket_no||0).padStart(5,"0")+'</span></div><h1>'+h(t.title)+'</h1><p class="desc">'+h(t.description||"No description.")+'</p><div class="meta"><div><b>CATEGORY</b>'+h(t.category)+'</div><div><b>REPORTED BY</b>'+h(t.reported_by||"-")+'</div><div><b>STATUS</b>'+h(statusLabel(t.status))+'</div><div><b>CREATED</b>'+fmt(t.created_at)+'</div><div><b>DUE</b>'+fmt(t.due_at)+'</div></div>'+(t.status==="waiting"?'<div class="card" style="background:#fbf0df"><b>Waiting</b><p>'+h(t.waiting_reason||"HQ follow-up pending")+(t.follow_up_at?"  -  "+fmt(t.follow_up_at):"")+'</p></div>':"")+(t.status==="completed"&&t.resolution?'<div class="card" style="background:#eaf6ee"><b>Resolution</b><p>'+h(t.resolution)+'</p></div>':"")}
function detail(id){
  const t=tickets.find(x=>x.id===id);if(!t||!session)return;
  const v=openView("detail",id,"Ticket Detail",'<div class="detailCard"><div id="ticketSummary">'+ticketSummary(t)+'</div><div><b>Attachments</b><div id="attachments" class="attachments">Loading...</div></div><form class="form" onsubmit="event.preventDefault();addAttachment()"><label for="followupFile">Add photo / video (up to 50 MB)</label><input id="followupFile" type="file" accept="image/*,video/*"><button id="postAttachment" class="secondary" type="submit">Upload attachment</button><div id="attachmentStatus" class="formNote" role="status"></div></form><div id="reopenWrap"></div><div id="events" class="timeline">Loading timeline...</div><div id="comments">Loading comments...</div><form class="form" onsubmit="event.preventDefault();comment()"><label for="comment">Add comment</label><textarea id="comment" required placeholder="Add an update for HQ..."></textarea><button id="postComment" class="secondary" type="submit">Post comment</button><div id="commentStatus" role="status" class="formNote"></div></form></div>');
  updateAttachmentView(v);refreshDetail(v);
}
async function refreshDetail(v){
  if(!isCurrent(v)||v.partsBusy)return;v.partsBusy=true;
  const specs=[['events','ops_ticket_events','id,event_type,message,created_at','asc'],['comments','ops_ticket_comments','id,body,created_at','asc'],['attachments','ops_ticket_attachments','id,storage_path,file_name,mime_type,created_at','asc'],['reopenWrap','ops_reopen_requests','id,reason,status,created_at,reviewed_at','desc']];
  try{await Promise.all(specs.map(async([boxId,table,select,order])=>{
    try{
      const rows=await api('/rest/v1/'+table+'?ticket_id=eq.'+encodeURIComponent(v.id)+'&select='+select+'&order=created_at.'+order,{signal:v.controller.signal});if(!isCurrent(v))return;
      const box=document.getElementById(boxId),list=rows||[];
      if(boxId==='events')box.innerHTML='<b>Timeline</b>'+(list.length?list.map(e=>'<div class="tl"><i></i><div><strong>'+h(e.message||e.event_type)+'</strong><span>'+h((e.event_type||"").replaceAll("_"," "))+'</span></div><span>'+fmt(e.created_at)+'</span></div>').join(""):'<div class="empty" style="padding:18px">No events yet.</div>');
      else if(boxId==='comments')box.innerHTML='<b>Comments</b>'+(list.length?list.map(c=>'<div class="comment"><b>'+fmt(c.created_at)+'</b><p>'+h(c.body)+'</p></div>').join(""):'<div class="empty" style="padding:18px">No comments yet.</div>');
      else if(boxId==='attachments'){const key=JSON.stringify(list);if(key!==v.attachmentsKey){v.attachmentsKey=key;await renderAttachments(list,v)}}
      else renderReopen(v,list);
    }catch(e){if(isCurrent(v)&&e.name!=="AbortError"){const box=document.getElementById(boxId);box.replaceChildren();const msg=document.createElement("p");msg.className="formNote";msg.textContent="Could not load "+({events:"timeline",comments:"comments",attachments:"attachments",reopenWrap:"reopen requests"}[boxId])+".";const retry=document.createElement("button");retry.className="secondary";retry.textContent="Retry";retry.onclick=()=>refreshDetail(v);box.append(msg,retry)}}
  }))}finally{v.partsBusy=false;if(v.refreshAgain&&isCurrent(v)){v.refreshAgain=false;refreshDetail(v)}}
}
async function renderAttachments(list,v){
  const box=document.getElementById("attachments");v.urls.forEach(u=>URL.revokeObjectURL(u));v.urls.clear();box.innerHTML=list.length?"":'<div class="formNote">No attachments.</div>';
  await Promise.all(list.map(async a=>{
    const el=document.createElement("div");el.className="attachment";box.appendChild(el);
    const load=async()=>{el.textContent="Loading "+a.file_name+"...";try{
      const response=await request("/storage/v1/object/authenticated/ops-ticket-attachments/"+a.storage_path.split("/").map(encodeURIComponent).join("/"),{signal:v.controller.signal});const blob=await response.blob();if(!isCurrent(v))return;
      const url=URL.createObjectURL(blob);v.urls.add(url);el.replaceChildren();
      if((a.mime_type||"").startsWith("image/")){const button=document.createElement("button");button.type="button";button.setAttribute("aria-label","Expand photo: "+a.file_name);button.setAttribute("aria-expanded","false");const img=document.createElement("img");img.alt=a.file_name;img.src=url;button.appendChild(img);button.onclick=()=>{const expanded=el.classList.toggle("expanded");button.setAttribute("aria-expanded",String(expanded));button.setAttribute("aria-label",(expanded?"Collapse photo: ":"Expand photo: ")+a.file_name)};el.appendChild(button)}
      else if((a.mime_type||"").startsWith("video/")){const video=document.createElement("video");video.controls=true;video.preload="metadata";video.src=url;video.setAttribute("aria-label",a.file_name);el.appendChild(video)}
      else{const link=document.createElement("a");link.href=url;link.download=a.file_name;link.textContent="Download "+a.file_name;el.appendChild(link)}
    }catch(e){if(isCurrent(v)&&e.name!=="AbortError"){el.replaceChildren();const button=document.createElement("button");button.textContent="Retry "+a.file_name;button.onclick=load;el.appendChild(button)}}};await load();
  }));
}
function renderReopen(v,list){
  if(!isCurrent(v))return;const box=document.getElementById("reopenWrap"),t=tickets.find(t=>t.id===v.id),pending=list.find(x=>x.status==="pending"),latest=list[0];
  if(pending){box.innerHTML='<div class="reopenBox"><b>Reopen requested</b><p>'+h(pending.reason)+'  -  Waiting for HQ review.</p></div>';return}
  const reviewed=latest?'<div class="reopenBox"><b>Reopen '+h(latest.status)+'</b><p>'+h(latest.reason)+(latest.reviewed_at?'  -  '+fmt(latest.reviewed_at):'')+'</p></div>':'';
  box.innerHTML=reviewed+(canReport()&&t?.status==="completed"?'<div class="reopenBox"><b>Still not resolved?</b><p>If the issue remains after completion, ask HQ to reopen this ticket.</p><button id="reopenButton" class="secondary">Issue not resolved</button></div>':'');
  document.getElementById("reopenButton")?.addEventListener("click",()=>reopenForm(v.id));
}
function reopenForm(id){
  if(!canReport()||!tickets.some(t=>t.id===id))return;
  const v=openView("reopen",id,"Request Reopen",'<form class="form detailCard" onsubmit="event.preventDefault();requestReopen()"><label for="reopenReason">What is still wrong?</label><textarea id="reopenReason" required minlength="3" maxlength="1000" placeholder="Explain why this issue is not resolved."></textarea><button id="sendReopen" class="primary" type="submit">Send to HQ</button><button id="backToTicket" class="secondary" type="button">Back to ticket</button><div id="reopenStatus" role="status" class="formNote"></div></form>');
  document.getElementById("backToTicket").onclick=()=>detail(id);v.operation=null;
}
async function requestReopen(){
  const v=view;if(!canReport()||!v||v.kind!=="reopen"||v.busy||!isCurrent(v))return;
  const input=document.getElementById("reopenReason"),reason=input.value.trim();if(reason.length<3||reason.length>1000){toast("Please add a reason between 3 and 1,000 characters.");return}
  v.busy=true;input.disabled=true;document.getElementById("sendReopen").disabled=true;document.getElementById("reopenStatus").textContent="Sending...";
  if(!v.operation)v.operation={id:crypto.randomUUID(),ticket_id:v.id,store_id:store.id,requested_by:session.user.id,reason};
  try{await insertOnce("ops_reopen_requests",v.operation,{signal:v.controller.signal});if(isCurrent(v)){detail(v.id);toast("Reopen request sent to HQ.")}}
  catch(e){if(isCurrent(v)&&e.name!=="AbortError"){if(e.status===409){detail(v.id);toast("A reopen request is already pending for this ticket.")}else document.getElementById("reopenStatus").textContent="Could not confirm the request. Retry to check or finish the same request. "+e.message}}
  finally{v.busy=false;if(isCurrent(v)){document.getElementById("sendReopen").disabled=false;/* Preserve the payload on uncertain retries. */}}
}
async function comment(){
  const v=view;if(!v||v.kind!=="detail"||v.busy||!isCurrent(v))return;
  const input=document.getElementById("comment"),body=input.value.trim();if(!body)return;
  v.busy=true;input.disabled=true;document.getElementById("postComment").disabled=true;document.getElementById("commentStatus").textContent="Sending...";
  if(!v.operation)v.operation={id:crypto.randomUUID(),ticket_id:v.id,author_id:session.user.id,body};
  try{await insertOnce("ops_ticket_comments",v.operation,{signal:v.controller.signal});if(isCurrent(v)){input.value="";v.operation=null;document.getElementById("commentStatus").textContent="Comment added.";if(v.partsBusy)v.refreshAgain=true;else refreshDetail(v)}}
  catch(e){if(isCurrent(v)&&e.name!=="AbortError")document.getElementById("commentStatus").textContent="Could not confirm the comment. Retry to check or finish the same comment. "+e.message}
  finally{v.busy=false;if(isCurrent(v)){input.disabled=!!v.operation;document.getElementById("postComment").disabled=false}}
}
function updateAttachmentView(v){
  if(!isCurrent(v))return;const d=attachmentDrafts.get(v.id),input=document.getElementById("followupFile"),button=document.getElementById("postAttachment");
  input.disabled=!!d;button.disabled=!!d?.busy;button.textContent=d?(d.busy?"Uploading...":"Retry attachment"):"Upload attachment";
  document.getElementById("attachmentStatus").textContent=d?.error||(d?"Uploading "+d.file.name+"...":"");
}
async function addAttachment(){
  const v=view;if(!v||v.kind!=="detail"||!isCurrent(v))return;
  let d=attachmentDrafts.get(v.id);if(d?.busy)return;
  if(!d){
    const file=document.getElementById("followupFile").files[0];if(!file){toast("Choose a photo or video.");return}
    if(file.size>MAX_FILE_SIZE||!(/^(image|video)\//).test(file.type)||file.type.toLowerCase()==="image/svg+xml"||/\.svgz?$/i.test(file.name)){toast("Choose a photo or video up to 50 MB. SVG files are not supported.");return}
    d={id:v.id,file,attachmentId:crypto.randomUUID(),payload:{created_by:session.user.id},uploaded:false,busy:false,error:""};attachmentDrafts.set(v.id,d);
  }
  const epoch=authEpoch,scope=scopeEpoch,signal=scopeController.signal;d.busy=true;d.error="";updateAttachmentView(v);
  try{
    // Closing a detail does not abandon a committed upload; switching stores or signing out does.
    await upload(d,{signal});if(!currentScope(epoch,scope))return;attachmentDrafts.delete(v.id);
    const target=view?.kind==="detail"&&view.id===v.id&&isCurrent(view)?view:null;
    if(target){document.getElementById("followupFile").value="";updateAttachmentView(target);document.getElementById("attachmentStatus").textContent="Attachment added.";if(target.partsBusy)target.refreshAgain=true;else refreshDetail(target)}
  }catch(e){if(currentScope(epoch,scope)&&e.name!=="AbortError")d.error="Could not confirm the attachment. Retry to finish the same upload. "+e.message}
  finally{d.busy=false;if(currentScope(epoch,scope)&&attachmentDrafts.has(v.id)&&view?.kind==="detail"&&view.id===v.id)updateAttachmentView(view)}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&session&&store)loadTickets(true)});
if(session)boot();else loginPage();
</script></body></html>
