async function timedFetch(url,opts={},timeout=25000){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
  try{return await fetch(url,{...opts,signal:controller.signal})}
  catch(e){throw new Error(e.name==="AbortError"?"Request timed out. Please try again.":"Connection unavailable. Please try again.")}
  finally{clearTimeout(timer)}
}

async function api(path,opts={},retry=true){
  if(!session)throw new Error("Not signed in");
  const epoch=sessionEpoch,token=session.access_token;
  const res=await timedFetch(SB_URL+path,{...opts,headers:{...authHeaders(),...(opts.headers||{})}});
  if(epoch!==sessionEpoch)throw new Error("Session changed. Please sign in again.");
  if(res.status===401&&retry&&session?.refresh_token){
    const ok=session.access_token!==token||await refreshSession();
    if(epoch!==sessionEpoch)throw new Error("Session changed");
    if(ok)return api(path,opts,false);
  }
  if(!res.ok){let msg="Request failed ("+res.status+")",code="";try{const j=await res.json();msg=j.error||j.message||j.error_description||j.hint||j.details||msg;code=j.error||j.code||""}catch{}if(epoch!==sessionEpoch)throw new Error("Session changed");if(res.status===401)logout();const error=new Error(msg);error.code=code;error.status=res.status;throw error}

  const txt=await res.text();if(epoch!==sessionEpoch)throw new Error("Session changed. Please sign in again.");return txt?JSON.parse(txt):null;
}

}

async function refreshSession(){
  if(refreshPromise)return refreshPromise;

  const epoch=sessionEpoch,token=session.refresh_token;
  refreshPromise=(async()=>{
    try{
      const r=await timedFetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:token})});
      if(epoch!==sessionEpoch)return false;
      if(!r.ok){if(r.status===400||r.status===401){logout();return false}throw new Error("Session refresh unavailable. Please try again.")}
      const next=await r.json();if(!next.access_token||!next.refresh_token||!next.user?.id)throw new Error("Invalid session response");
      if(epoch!==sessionEpoch)return false;
      session=next;localStorage.setItem("hanokops_session",JSON.stringify(session));syncNativeSession();return true;
    }catch(e){if(!session)return false;throw e}
  })();
  try{return await refreshPromise}finally{refreshPromise=null}
}

async function checkForAppUpdate(silent=false){

    if(!isNewerVersion(latest,current)){if(!silent)toast("报告老板 "+current+" is up to date");return}
    if(!/^https:\/\/github\.com\/397024611\/hanok-ops\/releases\/download\//.test(asset.browser_download_url))throw new Error("Untrusted update URL");

  }catch(e){if(!silent)toast("Could not check for updates")}
}

function suggestedDue(text){
  const q=text.toLowerCase(),d=new Date();
  const setHour=()=>{d.setHours(17,0,0,0);if(d<new Date())d.setHours(new Date().getHours()+2,0,0,0)};
  if(/tomorrow|明天/.test(q)){d.setDate(d.getDate()+1);d.setHours(17,0,0,0);return d}
  if(/today|今天/.test(q)){setHour();return d}
  const names=[["sunday",0],["monday",1],["tuesday",2],["wednesday",3],["thursday",4],["friday",5],["saturday",6]];
  for(const [name,day] of names){if(q.includes(name)){let add=(day-d.getDay()+7)%7;if(add===0)add=7;d.setDate(d.getDate()+add);d.setHours(17,0,0,0);return d}}
  return null
}
function detectWaiting(text){
  const q=text.toLowerCase();if(!/waiting for|wait for|follow up|等待|等着|等/.test(q))return null;
  if(/westfield|centre|center|shopping centre|商场|物业/.test(q))return "Centre Management";
  if(/landlord|房东/.test(q))return "Landlord";
  if(/supplier|供应商/.test(q))return "Supplier";
  if(/contractor|builder|electrician|plumber|施工|承包商/.test(q))return "Contractor";
  if(/staff|employee|员工/.test(q))return "Staff";
  return "Other"
}

}

  let path="/rest/v1/ops_tickets?id=eq."+encodeURIComponent(id)+"&status=eq."+encodeURIComponent(current.status);

  const rows=await api(path,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(changes)});
  if(!rows?.length){await loadTickets(true);throw new Error("Another user updated this ticket. Refresh and review the latest version.")}

function stopPendingTicket(){
  if(mutations.has("create-ticket")){toast("Wait for the current submission to finish");return}
  const d=pendingTicketDraft;if(!d)return;
  const message=d.created?"Keep the saved ticket and stop retrying this attachment? The ticket will not be deleted.":"Stop retrying this submission? A ticket may already be saved. It will not be deleted. Check Tickets before creating another.";
  if(!window.confirm(message))return;
  localStorage.removeItem(pendingDraftKey());pendingTicketDraft=null;ticketDraft=null;closeDetail();page="tickets";render();toast(d.created?"Ticket kept without completing this attachment":"Retry stopped. Check Tickets before submitting again.");
}
async function retryPendingTicket(){
  const d=pendingTicketDraft;if(!d)return;
  if(d.needsFile){const file=document.getElementById("resumeFile")?.files?.[0];if(!file){toast("Select the original attachment");return}if(file.name!==d.file.name||file.size!==d.file.size||file.type!==d.file.type){toast("Choose the original file shown above");return}d.file=file;d.needsFile=false}
  ticketDraft=d;try{await saveTicketDraft(d.payload,d.file,"tickets")}catch(e){toast(e.message)}
}

function newTicket(defaultStoreId=null,seedTitle="",seedDesc="",seedCategory="Other"){
  if(pendingTicketDraft){resumePendingTicket();return}
  newTicketDraft();
  const storeSelect=isHQ()?'<label>Store</label><select id="newStore">'+stores.map(s=>'<option value="'+s.id+'" '+(defaultStoreId===s.id?"selected":"")+'>'+escapeHtml(s.name)+'</option>').join("")+'</select>':'';
  detail.className="overlay show";detail.innerHTML='<div class="detailTop"><button onclick="closeDetail()">‹</button><b>New Ticket</b><button></button></div><div class="sheet form"><div class="detailCard">'+storeSelect+'<label>Title</label><input id="newTitle" placeholder="What needs attention?" value="'+escapeHtml(seedTitle)+'"><label>Description</label><textarea id="newDesc" placeholder="Describe the issue">'+escapeHtml(seedDesc)+'</textarea><label>Category</label><select id="newCat">'+["Maintenance","Supplier / Stock","IT / POS","Marketing","HR / Staff","Finance","Landlord / Centre","Health & Safety","Other"].map(x=>'<option '+(x===seedCategory?"selected":"")+'>'+x+'</option>').join("")+'</select><label>Priority</label><select id="newPri"><option value="normal">Normal</option><option value="urgent">Urgent</option></select><label>Due date (optional)</label><input id="newDue" type="datetime-local"><label>Photo / video (optional)</label><input id="newFile" type="file" accept="image/*,video/*"><button class="primary" onclick="createTicket()">Submit to HQ</button></div></div>'
}
async function uploadAttachment(ticketId,file,draft=ticketDraft){
  if(!file)return;validateAttachment(file);
  const epoch=sessionEpoch,userId=session.user.id;
  const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=draft?.uploadPath||(ticketId+"/"+crypto.randomUUID()+"_"+clean);if(draft){draft.uploadPath=path;if(draft.payload)persistPendingTicket(draft)}
  if(!draft?.uploaded){
    const send=()=>timedFetch(SB_URL+"/storage/v1/object/ops-ticket-attachments/"+path.split("/").map(encodeURIComponent).join("/"),{method:"POST",headers:authHeaders({"Content-Type":file.type,"x-upsert":"true"}),body:file},300000);
    let r=await send();if(epoch!==sessionEpoch)throw new Error("Session changed");
    if(r.status===401){const ok=await refreshSession();if(epoch!==sessionEpoch)throw new Error("Session changed");if(ok)r=await send()}
    if(epoch!==sessionEpoch)throw new Error("Session changed");
    if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.message||"Attachment upload failed")}
    if(draft){draft.uploaded=true;if(draft.payload)persistPendingTicket(draft)}
  }
  if(epoch!==sessionEpoch)throw new Error("Session changed");
  await api("/rest/v1/ops_ticket_attachments?on_conflict=storage_path",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"resolution=ignore-duplicates,return=minimal"},body:JSON.stringify({ticket_id:ticketId,uploaded_by:userId,storage_path:path,file_name:file.name,mime_type:file.type,size_bytes:file.size})});
}
async function saveTicketDraft(payload,file,destination){
  requireHQ();validateAttachment(file);const draft=ticketDraft||newTicketDraft(),view=detail.firstElementChild,epoch=sessionEpoch;
  return withMutation("create-ticket",async()=>{
    draft.payload=draft.payload||payload;draft.file=draft.file||file;payload=draft.payload;file=draft.file;persistPendingTicket(draft);
    if(draft.needsFile)throw new Error("Select the original attachment to continue");
    if(!draft.created){
      try{await api("/rest/v1/ops_tickets",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({...payload,id:draft.id})});draft.created=true;draft.file=file}
      catch(e){if(epoch!==sessionEpoch)throw new Error("Session changed");const rows=await api("/rest/v1/ops_tickets?id=eq."+draft.id+"&select=id");if(!rows?.length)throw e;draft.created=true;draft.file=file}
    }
    if(epoch!==sessionEpoch)throw new Error("Session changed");
    persistPendingTicket(draft);
    try{if(draft.file)await uploadAttachment(draft.id,draft.file,draft)}catch(e){
      if(epoch!==sessionEpoch)throw new Error("Session changed");
      persistPendingTicket(draft);
      toast("Ticket saved. "+e.message+". Submit again to retry only the attachment.");await loadTickets(true);return;
    }
    if(epoch!==sessionEpoch)throw new Error("Session changed");
    pendingTicketDraft=null;localStorage.removeItem(pendingDraftKey());
    await loadTickets(true,true);if(sameDetail(view)){closeDetail();page=destination;render()}toast("Ticket saved");
  });
}

async function createTicket(){
  const title=document.getElementById("newTitle")?.value.trim();if(!title){toast("Add a title");return}
  const storeId=document.getElementById("newStore")?.value;if(!storeId){toast("Choose a store");return}
  const due=document.getElementById("newDue").value,file=document.getElementById("newFile").files[0];
  const payload={store_id:storeId,created_by:session.user.id,title,description:document.getElementById("newDesc").value.trim(),category:document.getElementById("newCat").value,priority:document.getElementById("newPri").value,due_at:due?new Date(due).toISOString():null};
  try{await saveTicketDraft(payload,file,"tickets")}catch(e){toast(e.message)}
}


// Account administration is authorized again on the server for every request.
// Passwords and incomplete operations stay in memory only and are cleared on exit.
let accountManagement={accounts:[],pending:[],resume:null,passwordEditable:false,stores:[],loaded:false,busy:false,error:"",notice:"",view:"list",target:null,requestId:null,payload:null,sequence:0};
function isAccountAdmin(){return !!session&&profile?.role==="admin"&&profile.active!==false}
function requireAccountAdmin(){if(!isAccountAdmin())throw new Error("Only an active administrator can manage accounts.")}
function clearAccountManagement(){
  accountManagement={accounts:[],pending:[],resume:null,passwordEditable:false,stores:[],loaded:false,busy:false,error:"",notice:"",view:"list",target:null,requestId:null,payload:null,sequence:accountManagement.sequence+1};
  const password=document.getElementById("accountPassword");if(password)password.value="";
}
async function accountAction(action,payload={}){
  requireAccountAdmin();
  return await api("/functions/v1/ops-admin-accounts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...payload})});
}
async function openAccounts(){
  try{requireAccountAdmin()}catch(e){toast(e.message);return}
  closeDetail();clearAccountManagement();page="accounts";render();await loadManagedAccounts();
}
async function loadManagedAccounts(){
  if(!isAccountAdmin()||accountManagement.busy)return;
  const own=accountManagement,sequence=++own.sequence,epoch=sessionEpoch;own.busy=true;own.error="";
  if(page==="accounts"&&own.view==="list")render();
  try{
    const data=await accountAction("list");
    if(epoch!==sessionEpoch||own!==accountManagement||sequence!==own.sequence)return;
    if(!Array.isArray(data?.accounts)||!Array.isArray(data?.stores))throw new Error("The server did not return the account list.");
    own.accounts=data.accounts;own.pending=Array.isArray(data.pending_requests)?data.pending_requests:[];own.stores=data.stores.filter(s=>s.active!==false);own.loaded=true;
  }catch(e){if(epoch===sessionEpoch&&own===accountManagement)own.error=e.message}
  finally{if(epoch===sessionEpoch&&own===accountManagement&&sequence===own.sequence){own.busy=false;if(page==="accounts"&&own.view==="list")render()}}
}
function managedAccountName(a){return a.display_name||a.email||"Account"}
function managedAccountRole(a){if(a.is_legacy_shared)return "Shared store login";return ({store:"Store staff",partner:"Partner",hq:"HQ",admin:"Administrator",pending:"Pending setup"})[a.role]||"Account"}
function managedStores(a){return (a.store_ids||[]).map(id=>accountManagement.stores.find(s=>s.id===id)?.name||"Unavailable store").join(", ")||"No stores assigned"}
function accountCard(a,index){
  const editable=["store","partner"].includes(a.role)&&a.user_id!==session.user.id;
  return '<section class="card accountCard"><div class="row between"><span class="pill '+(a.role==="partner"?'gold':'blue')+'">'+escapeHtml(managedAccountRole(a))+'</span><span class="pill '+(a.active===false?'gray':'green')+'">'+(a.active===false?'Inactive':'Active')+'</span></div><h3>'+escapeHtml(managedAccountName(a))+'</h3><p class="accountEmail">'+escapeHtml(a.email||"")+'</p><p class="accountScope">'+escapeHtml(["admin","hq"].includes(a.role)?'All stores':managedStores(a))+'</p>'+(editable&&a.active!==false?'<div class="inlineBtns">'+(!a.is_legacy_shared?'<button type="button" onclick="editAccountStores('+index+')">Assign stores</button>':'')+'<button type="button" class="dangerText" onclick="confirmDeactivateAccount('+index+')">Deactivate</button></div>':'')+'</section>';
}
function accountsPage(){
  if(!isAccountAdmin())return profilePage();
  const state=accountManagement;
  let body='';
  if(state.view==="create")body=newAccountForm();
  else if(state.view==="assign")body=assignAccountForm();
  else if(state.view==="deactivate")body=deactivateAccountForm();
  else{
    const editable=state.accounts.filter(a=>["store","partner"].includes(a.role));
    body='<div class="accountIntro"><span class="eyebrow">OWNER CONTROLS</span><h2>People & access</h2><p>Give each person their own login and just the stores they need.</p></div><div class="accountSummary"><div><b>'+editable.filter(a=>a.active!==false).length+'</b><span>Active accounts</span></div><div><b>'+editable.filter(a=>a.role==="partner"&&a.active!==false).length+'</b><span>Partners</span></div></div><button id="newAccountButton" type="button" class="primary" '+(!state.loaded||state.busy?'disabled':'')+' onclick="startNewAccount()">+ New account</button><div id="accountListStatus" class="accountStatus" role="status">'+escapeHtml(state.busy?'Loading accounts…':state.error||state.notice)+'</div>'+(state.error?'<button class="secondary" type="button" onclick="loadManagedAccounts()">Retry loading</button>':'')+(state.pending.length?'<div class="sectionTitle"><span>Setup to finish</span></div>'+state.pending.map((p,i)=>'<section class="card accountCard"><span class="pill gold">Incomplete setup</span><h3>'+escapeHtml(p.display_name||p.email)+'</h3><p class="accountEmail">'+escapeHtml(p.email)+'</p><button type="button" class="secondary" onclick="resumeManagedAccount('+i+')">Finish setup</button></section>').join(''):'')+(state.loaded?'<div class="sectionTitle"><span>Accounts</span><button type="button" onclick="loadManagedAccounts()" '+(state.busy?'disabled':'')+'>Refresh</button></div>'+state.accounts.map(accountCard).join(""):'');
  }
  return '<div class="screen"><div class="pageHead"><h1>Account management</h1><button type="button" aria-label="Back" onclick="accountBack()">‹</button></div><main class="content accountContent">'+body+'</main></div>';
}
function accountBack(){
  if(accountManagement.view!=="list"){
    accountManagement.sequence++;accountManagement.view="list";accountManagement.target=null;accountManagement.payload=null;accountManagement.requestId=null;accountManagement.resume=null;accountManagement.passwordEditable=false;accountManagement.busy=false;accountManagement.error="";render();loadManagedAccounts();
  }else go("profile");
}
function startNewAccount(){
  try{requireAccountAdmin()}catch(e){toast(e.message);return}
  if(accountManagement.busy||!accountManagement.loaded)return;
  accountManagement.view="create";accountManagement.resume=null;accountManagement.passwordEditable=false;accountManagement.requestId=crypto.randomUUID();accountManagement.payload=null;accountManagement.error="";render();document.getElementById("accountName")?.focus();
}
function storeAssignmentInputs(role,selected=[]){
  return accountManagement.stores.map((s,i)=>'<label class="accountStoreChoice"><input type="'+(role==="store"?'radio':'checkbox')+'" name="accountStores" id="accountStore'+i+'" value="'+escapeHtml(s.id)+'" '+(selected.includes(s.id)?'checked':'')+'><span>'+escapeHtml(s.name)+'<small>'+escapeHtml(s.code)+'</small></span></label>').join("")||'<p>No active stores are available.</p>';
}
function resumeManagedAccount(index){
  try{requireAccountAdmin()}catch(e){toast(e.message);return}
  const request=accountManagement.pending[index];if(!request||accountManagement.busy)return;
  accountManagement.view="create";accountManagement.resume=request;accountManagement.requestId=request.request_id;accountManagement.payload=null;accountManagement.passwordEditable=true;render();
  document.getElementById("accountName").value=request.display_name;document.getElementById("accountEmail").value=request.email;document.getElementById("accountRole").value=request.role;
  document.getElementById("accountStoreChoices").innerHTML=storeAssignmentInputs(request.role,request.store_ids||[]);lockAccountCreateFields(true);document.getElementById("accountPassword").focus();
}
function lockAccountCreateFields(passwordEditable){
  const fields=document.getElementById("accountFields");if(!fields)return;fields.disabled=false;
  for(const input of fields.querySelectorAll("input,select"))input.disabled=!(passwordEditable&&input.id==="accountPassword");
}
function newAccountForm(){
  const resuming=!!accountManagement.resume;
  return '<div class="accountIntro"><span class="eyebrow">NEW ACCOUNT</span><h2>'+ (resuming?'Finish account setup':'One person. Their stores.')+'</h2><p>'+(resuming?'Retry the original account request. If its sign-in was already created, the previously entered password stays unchanged.':'Staff can report issues for one store. Partners can view and follow up across the stores you choose.')+'</p></div><form id="accountCreateForm" class="form" onsubmit="event.preventDefault();createManagedAccount()"><fieldset id="accountFields"><label for="accountName">Full name</label><input id="accountName" autocomplete="off" maxlength="100" required><label for="accountEmail">Email address</label><input id="accountEmail" type="email" autocomplete="off" maxlength="254" required><label for="accountRole">Account type</label><select id="accountRole" onchange="changeAccountRole()"><option value="store">Store staff · one store</option><option value="partner">Partner · selected stores</option></select><label>Assigned stores</label><div id="accountStoreChoices">'+storeAssignmentInputs("store")+'</div><label for="accountPassword">Initial password</label><input id="accountPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><p class="accountHint">Use at least 12 characters, up to 72 UTF-8 bytes. Non-English characters can count as several bytes. Share it privately with this person. The password is never displayed in the account list.</p></fieldset><div id="accountActionStatus" class="accountStatus" role="status"></div><button id="accountSubmit" type="submit" class="primary">Create account</button><button type="button" class="secondary" onclick="accountBack()">Cancel</button></form>';
}
function changeAccountRole(){
  if(accountManagement.payload||accountManagement.resume)return;
  const role=document.getElementById("accountRole").value,selected=selectedAccountStores();
  document.getElementById("accountStoreChoices").innerHTML=storeAssignmentInputs(role,role==="store"?selected.slice(0,1):selected);
}
function selectedAccountStores(){return [...document.querySelectorAll('input[name="accountStores"]:checked')].map(e=>e.value)}
function validateAccountStores(role,ids){
  if(!["store","partner"].includes(role))throw new Error("Choose a staff or partner account.");
  if(!ids.length||role==="store"&&ids.length!==1)throw new Error(role==="store"?"Choose exactly one store for a staff account.":"Choose at least one store for a partner.");
  if(ids.some(id=>!accountManagement.stores.some(s=>s.id===id)))throw new Error("Choose an available store.");
}
async function createManagedAccount(){
  const state=accountManagement;if(state.busy||state.view!=="create")return;
  try{
    requireAccountAdmin();
    if(state.payload&&state.passwordEditable){const password=document.getElementById("accountPassword").value;if([...password].length<12||new Blob([password]).size>72)throw new Error("Use at least 12 characters and no more than 72 UTF-8 bytes.");state.payload.password=password;state.passwordEditable=false}
    if(!state.payload){
      const displayName=document.getElementById("accountName").value.trim(),email=document.getElementById("accountEmail").value.trim().toLowerCase(),role=document.getElementById("accountRole").value,password=document.getElementById("accountPassword").value,storeIds=selectedAccountStores();
      if(!displayName||displayName.length>100)throw new Error("Enter a name of 1–100 characters.");
      if(email.length>254||!/^\S+@\S+\.\S+$/.test(email))throw new Error("Enter a valid email address.");
      if([...password].length<12||new Blob([password]).size>72)throw new Error("Use at least 12 characters and no more than 72 UTF-8 bytes.");
      validateAccountStores(role,storeIds);state.payload={requestId:state.requestId,email,displayName,role,storeIds,password};
    }
    await submitManagedAccountAction("create",state.payload,"Account created. Share the login details privately.");
  }catch(e){const out=document.getElementById("accountActionStatus");if(out)out.textContent=e.message}
}
function editAccountStores(index){
  try{requireAccountAdmin()}catch(e){toast(e.message);return}
  const target=accountManagement.accounts[index];if(!target||target.is_legacy_shared||target.active===false||!["store","partner"].includes(target.role)||target.user_id===session.user.id)return;
  accountManagement.target=target;accountManagement.view="assign";accountManagement.error="";render();
}
function assignAccountForm(){
  const a=accountManagement.target;
  return '<div class="accountIntro"><span class="eyebrow">STORE ACCESS</span><h2>'+escapeHtml(managedAccountName(a))+'</h2><p>'+escapeHtml(a.email||"")+'</p></div><form class="form" onsubmit="event.preventDefault();saveAccountStores()"><fieldset id="accountFields"><p class="accountHint">'+(a.role==="store"?'Staff accounts belong to exactly one store.':'Partners can view and follow up for each selected store.')+' Removing a store blocks further access to its data.</p><div id="accountStoreChoices">'+storeAssignmentInputs(a.role,a.store_ids||[])+'</div></fieldset><div id="accountActionStatus" class="accountStatus" role="status"></div><button id="accountSubmit" type="submit" class="primary">Save store access</button><button type="button" class="secondary" onclick="accountBack()">Cancel</button></form>';
}
async function saveAccountStores(){
  const state=accountManagement;if(state.busy||state.view!=="assign")return;
  try{requireAccountAdmin();const storeIds=selectedAccountStores();validateAccountStores(state.target.role,storeIds);await submitManagedAccountAction("assign",{userId:state.target.user_id,storeIds},"Store access updated.")}
  catch(e){const out=document.getElementById("accountActionStatus");if(out)out.textContent=e.message}
}
function confirmDeactivateAccount(index){
  try{requireAccountAdmin()}catch(e){toast(e.message);return}
  const target=accountManagement.accounts[index];if(!target||target.active===false||!["store","partner"].includes(target.role)||target.user_id===session.user.id)return;
  accountManagement.target=target;accountManagement.view="deactivate";accountManagement.error="";render();
}
function deactivateAccountForm(){
  const a=accountManagement.target;
  return '<section class="card accountCard deactivateCard"><span class="pill red">Remove access</span><h2>Deactivate '+escapeHtml(managedAccountName(a))+'?</h2><p>'+escapeHtml(a.email||"")+'</p><p>This person will lose access to every assigned store, including when already signed in. Their past reports and comments will stay.</p><div id="accountActionStatus" class="accountStatus" role="status"></div><button id="accountSubmit" class="primary dangerButton" type="button" onclick="deactivateManagedAccount()">Deactivate account</button><button type="button" class="secondary" onclick="accountBack()">Keep account active</button></section>';
}
async function deactivateManagedAccount(){
  const state=accountManagement;if(state.busy||state.view!=="deactivate")return;
  try{requireAccountAdmin();await submitManagedAccountAction("deactivate",{userId:state.target.user_id},"Account deactivated.")}
  catch(e){const out=document.getElementById("accountActionStatus");if(out)out.textContent=e.message}
}
async function submitManagedAccountAction(action,payload,message){
  const own=accountManagement,epoch=sessionEpoch,sequence=++own.sequence,view=own.view;
  requireAccountAdmin();own.busy=true;
  const status=document.getElementById("accountActionStatus"),submit=document.getElementById("accountSubmit"),fields=document.getElementById("accountFields");
  if(status)status.textContent="Saving…";if(submit)submit.disabled=true;if(fields)fields.disabled=true;
  try{
    const result=await accountAction(action,payload);
    if(epoch!==sessionEpoch||own!==accountManagement||own.sequence!==sequence||own.view!==view)return;
    if(result?.ok!==true||!result.account?.user_id)throw new Error("The server did not confirm this change.");
    if(action!=="create"&&result.account.user_id!==payload.userId)throw new Error("The server did not confirm the intended account.");
    if(action==="deactivate"&&result.account.active!==false)throw new Error("Deactivation was not confirmed.");
    own.notice=action==="create"&&result.account.active===false?"This account is inactive. It has not been re-enabled.":action==="create"&&result.password_unchanged?"Account setup finished. The original password is unchanged.":message;own.payload=null;own.requestId=null;own.target=null;own.resume=null;own.passwordEditable=false;own.view="list";own.busy=false;render();toast(own.notice);await loadManagedAccounts();
  }catch(e){
    if(epoch!==sessionEpoch||own!==accountManagement||own.sequence!==sequence||own.view!==view)return;
    if(action==="create"&&["password_rejected","invalid_password"].includes(e.code)){own.passwordEditable=true;if(status?.isConnected)status.textContent="This password was rejected. Enter a stronger password below and retry the same account request."}
    else if(status?.isConnected)status.textContent="Change not confirmed. "+e.message+(action==="create"?" Retry checks the same account request. To change these details, cancel and start again.":" You can safely retry this change.");
  }finally{
    if(epoch===sessionEpoch&&own===accountManagement&&own.sequence===sequence&&own.view===view){own.busy=false;if(submit?.isConnected)submit.disabled=false;if(fields?.isConnected){if(action==="create"&&own.payload)lockAccountCreateFields(own.passwordEditable);else fields.disabled=false}}
  }
}

// Prevent repeat taps during a pending write, including comment and reopen actions.
for(const name of ["signIn","signUp","forgotPassword","verifyRecoveryLink","setRecoveredPassword","reviewReopen","assignTicket","startTicket","acceptTicket","saveWaiting","completeTicket","addComment","markAllRead","previewCapture","runAiQuery","loadAiBrief","ticketAiAssist"]){
  const original=window[name];window[name]=async function(...args){
    const key="action:"+name;if(mutations.has(key))return;mutations.add(key);
    try{return await original(...args)}finally{mutations.delete(key)}
  };
}

if(session)boot();else showLogin();
