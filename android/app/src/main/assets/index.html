ner{width:34px;height:34px;border:3px solid #ffffff2b;border-top-color:#d9bd83;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.comment{padding:10px 12px;background:#f5f2ed;border-radius:11px;margin-top:8px}.comment b{font-size:11px}.comment p{font-size:12px;margin:4px 0 0;color:#66727c}.attachments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}.attachment{border:1px solid var(--line);background:#f5f2ed;border-radius:12px;overflow:hidden;min-height:72px;display:grid;place-items:center}.attachment img{width:100%;height:130px;object-fit:cover}.attachment button{width:100%;height:100%;min-height:72px;border:0;background:#f5f2ed;font-size:11px;font-weight:800;color:#42515c}.notice{padding:12px 13px}.notice.unread{border-left:3px solid var(--gold)}.notice h3{margin:7px 0 4px;font-size:14px}.notice p{margin:0;font-size:11px;color:#697680}.reopenCard{background:#fff3df;border:1px solid #ead1a2;border-radius:13px;padding:12px;margin:12px 0}.reopenCard p{font-size:11px;color:#735c32;line-height:1.45}.reopenActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reopenActions button{border:1px solid #d9d0c3;background:#fff;border-radius:10px;padding:11px;font-weight:800}.reopenActions .approve{background:#193149;color:#fff;border-color:#193149}.ticketMeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:10px;color:#8b7650}.ticketMeta span{background:#f4efe6;border-radius:999px;padding:4px 7px}.quickGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}.quickGrid button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-size:11px;font-weight:800;color:#243746}.quickGrid button b{display:block;font-size:18px;margin-bottom:3px;color:#aa8246}.miniEmpty{padding:16px 8px;color:#8c969e;font-size:12px;text-align:center}.sectionTitle .count{font-size:10px;color:#fff;background:#1d3447;border-radius:999px;padding:4px 8px}.storeCard.tap{cursor:pointer;transition:.12s}.storeCard.tap:active{transform:scale(.99)}.storeHero{background:linear-gradient(160deg,#061827,#0d2a40);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}.storeHero h2{font:700 25px Georgia,serif;margin:4px 0}.storeHero p{margin:0;color:#a8b5bf;font-size:11px}.storeOverview{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.storeOverview .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.storeOverview .box b{display:block;font-size:22px}.storeOverview .box span{font-size:10px;color:#77828c}.storeActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.storeActions button{border:1px solid #d8d2c8;background:#fff;border-radius:12px;padding:12px;font-weight:800;color:#263846}.storeActions .primaryMini{background:linear-gradient(135deg,#cba967,#8f6835);color:#fff;border:0}.captureBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:14px 0}.captureBox textarea{width:100%;min-height:86px;border:0;outline:0;resize:none;font-size:15px;line-height:1.45;color:#172a39;background:transparent}.captureActions{display:grid;grid-template-columns:52px 1fr;gap:8px;margin-top:10px}.captureActions button{border:1px solid #d8d2c8;background:#fff;border-radius:13px;padding:12px;font-weight:850}.captureActions .captureGo{background:linear-gradient(135deg,#cba967,#8f6835);border:0;color:#fff}.captureHint{font-size:10px;color:#89949c;margin-top:6px}.projectCard{padding:14px}.projectCard h3{margin:7px 0 4px;font-size:15px}.projectCard p{margin:0;color:#6a7680;font-size:11px;line-height:1.4}.projectStage{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#755a2f;background:#f6ead5;border-radius:999px;padding:5px 8px}.projectMeta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:#8b949c;font-size:10px}.projectNext{margin-top:9px;padding:9px 10px;background:#f4f1ec;border-r </style></head><body>
<div id="app"></div><div id="detail" class="overlay"></div><div id="toast" class="toast"></div><div id="loading" class="loading"><div class="spinner"></div></div>
<script>
const SB_URL="https://lludyxgivnmmkovhhrgg.supabase.co";
const SB_KEY="sb_publishable_YCeXPfqOdVS84ZRis-miEg_v7W0s3Dg";
let session=JSON.parse(localStorage.getItem("hanokops_session")||"null");
let profile=null, stores=[], tickets=[], notifications=[], projects=[], page="home", filter="active", refreshTimer=null;
const app=document.getElementById("app"), detail=document.getElementById("detail");

function showLoading(v){document.getElementById("loading").className="loading"+(v?" show":"")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1700)}
function fmtDate(s){if(!s)return "—";try{return new Intl.DateTimeFormat("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).format(new Date(s))}catch{return s}}
function age(s){const d=(Date.now()-new Date(s).getTime())/60000;if(d<2)return"Just now";if(d<60)return Math.floor(d)+"m ago";if(d<1440)return Math.floor(d/60)+"h ago";return Math.floor(d/1440)+"d ago"}
function statusClass(s){return s==="completed"?"green":s==="waiting"?"gold":(s==="new"||s==="accepted"||s==="in_progress")?"blue":"gray"}
function statusLabel(s){return ({new:"New",accepted:"Accepted",in_progress:"In Progress",waiting:"Waiting",completed:"Completed"})[s]||s}
function storeFor(id){return stores.find(s=>s.id===id)||{name:"Store",code:"OPS"}}
function ticketId(t){const s=storeFor(t.store_id);return s.code+"-"+String(t.ticket_no||0).padStart(5,"0")}
function authHeaders(extra={}){return {"apikey":SB_KEY,"Authorization":"Bearer "+session.access_token,...extra}}
function loadLocalProjects(){try{projects=JSON.parse(localStorage.getItem("hanokops_projects")||"[]");if(!Array.isArray(projects))projects=[]}catch{projects=[]}}
function saveLocalProjects(){localStorage.setItem("hanokops_projects",JSON.stringify(projects))}

async function api(path,opts={}){
  if(!session)throw new Error("Not signed in");
  const res=await fetch(SB_URL+path,{...opts,headers:{...authHeaders(),...(opts.headers||{})}});
  if(res.status===401 && session.refresh_token){
    const ok=await refreshSession();
    if(ok)return api(path,opts);
  }
  if(!res.ok){let msg="Request failed";try{const j=await res.json();msg=j.message||j.error_description||j.hint||j.details||msg}catch{}throw new Error(msg)}
  if(res.status===204)return null;
  const txt=await res.text();return txt?JSON.parse(txt):null;
}

async function refreshSession(){
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok)throw 0;session=await r.json();localStorage.setItem("hanokops_session",JSON.stringify(session));return true;
  }catch{logout(false);return false}
}

async function signIn(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const err=document.getElementById("loginErr");err.textContent="";showLoading(true);
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Sign in failed");
    session=j;localStorage.setItem("hanokops_session",JSON.stringify(session));await boot();
  }catch(e){err.textContent=e.message}finally{showLoading(false)}
}
async function signUp(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const err=document.getElementById("loginErr");err.textContent="";
  if(!email||password.length<8){err.textContent="Enter an email and password of at least 8 characters.";return}
  showLoading(true);
  try{
    const r=await fetch(SB_URL+"/auth/v1/signup",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password,data:{display_name:email.split("@")[0]}})});
    const j=await r.json();if(!r.ok)throw new Error(j.msg||j.message||"Account creation failed");
    if(j.access_token){session=j;localStorage.setItem("hanokops_session",JSON.stringify(session));await boot()}else{toast("Account created. Check your email, then sign in.")}
  }catch(e){err.textContent=e.message}finally{showLoading(false)}
}
function logout(render=true){session=null;profile=null;stores=[];tickets=[];localStorage.removeItem("hanokops_session");clearInterval(refreshTimer);if(render)showLogin()}

async function boot(){
  if(!session){showLogin();return}
  showLoading(true);
  try{
    const ps=await api("/rest/v1/ops_profiles?user_id=eq."+encodeURIComponent(session.user.id)+"&select=user_id,email,display_name,role,store_id");
    profile=ps&&ps[0];if(!profile)throw new Error("Profile not found");
    stores=await api("/rest/v1/ops_stores?select=id,code,name,active&active=eq.true&order=name.asc")||[];loadLocalProjects();
    if(profile.role==="pending"){render();return}
    await Promise.all([loadTickets(true),loadNotifications(true)]);
    clearInterval(refreshTimer);refreshTimer=setInterval(()=>refreshAll(),12000);
    render();
  }catch(e){toast(e.message);if(/JWT|token|signed/i.test(e.message))logout()}finally{showLoading(false)}
}

async function loadTickets(silent=false){
  if(!profile||profile.role==="pending")return;
  try{
    const data=await api("/rest/v1/ops_tickets?select=id,ticket_no,store_id,created_by,assigned_to,title,description,reported_by,category,priority,status,due_at,follow_up_at,waiting_reason,resolution,created_at,updated_at,completed_at&order=created_at.desc&limit=200");
    tickets=data||[];if(!silent)render();else if(page==="home"||page==="tickets")render();
  }catch(e){if(!silent)toast(e.message)}
}
async function loadNotifications(silent=false){if(!profile||profile.role==="pending")return;try{notifications=await api("/rest/v1/ops_notifications?select=id,ticket_id,kind,title,body,priority,read_at,created_at,data&order=created_at.desc&limit=100")||[];notifyNewNotifications();if(!silent&&page==="alerts")render()}catch(e){if(!silent)toast(e.message)}}
function notifyNewNotifications(){let seen=[];try{seen=JSON.parse(localStorage.getItem("hanokops_notified_ids")||"[]")}catch{}const set=new Set(seen);let changed=false;for(const n of notifications){if(!n.read_at&&!set.has(n.id)){if(window.AndroidApp&&typeof window.AndroidApp.notify==="function"){try{window.AndroidApp.notify(n.title,n.body||"Hanok Ops alert")}catch{}}set.add(n.id);changed=true}}if(changed)localStorage.setItem("hanokops_notified_ids",JSON.stringify(Array.from(set).slice(-300)))}
async function refreshAll(){await Promise.all([loadTickets(true),loadNotifications(true)]);if(["home","tickets","alerts","stores"].includes(page))render()}
async function loadEvents(id){return await api("/rest/v1/ops_ticket_events?ticket_id=eq."+id+"&select=id,event_type,message,details,created_at&order=created_at.asc")||[]}
async function loadComments(id){return await api("/rest/v1/ops_ticket_comments?ticket_id=eq."+id+"&select=id,author_id,body,created_at&order=created_at.asc")||[]}

function showLogin(){
  app.innerHTML='<div class="login"><div><div class="loginLogo">Hanok Ops</div><div class="loginTag">ONE GROUP · EVERY STORE · ALWAYS IN CONTROL</div></div><div class="loginBox"><h2>Sign in</h2><p>Use your Hanok Ops account to continue.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div id="loginErr" class="error"></div><button class="primary" onclick="signIn()">Sign in</button><button class="secondary" onclick="signUp()">Create account</button></div><div style="font-size:10px;color:#82929f;text-align:center">Hanok Group · Operations System · v0.6</div></div>'
}

function nav(){const unread=notifications.filter(n=>!n.read_at).length;
  return '<nav class="nav">'+[["⌂","Today","home"],["▤","Tickets","tickets"],["▦","Stores","stores"],["◆","Projects","projects"],["♢",unread?"Inbox "+unread:"Inbox","alerts"]].map(x=>'<button class="'+(page===x[2]?"active":"")+'" onclick="go(\''+x[2]+'\')"><b>'+x[0]+'</b>'+x[1]+'</button>').join("")+'</nav>'
}
function ticketCard(t){
  const s=storeFor(t.store_id), urgent=t.priority==="urgent";
  const meta=[];
  if(isOverdue(t))meta.push("Overdue · "+fmtDate(t.due_at));
  else if(isDueToday(t))meta.push("Due today · "+fmtDate(t.due_at));
  if(t.status==="waiting"&&t.follow_up_at)meta.push("Follow-up · "+fmtDate(t.follow_up_at));
  return '<div class="card ticket" onclick="openTicket(\''+t.id+'\')"><div class="row between"><div class="row"><span class="pill '+(urgent?"red":statusClass(t.status))+'">'+(urgent?"Urgent":statusLabel(t.status))+'</span><span class="store">'+s.name+'</span></div><span class="age">'+age(t.created_at)+'</span></div><h3>'+escapeHtml(t.title)+'</h3><p>'+escapeHtml(t.description||t.category)+'</p>'+(meta.length?'<div class="ticketMeta">'+meta.map(x=>'<span>'+escapeHtml(x)+'</span>').join("")+'</div>':'')+'<span class="chev">›</span></div>'
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function isHQ(){return profile&&["admin","hq"].includes(profile.role)}
function activeTickets(){return tickets.filter(t=>t.status!=="completed")}
function localDayBounds(){const now=new Date(),start=new Date(now),end=new Date(now);start.setHours(0,0,0,0);end.setHours(23,59,59,999);return{now,start,end}}
function isOverdue(t){return !!(t&&t.status!=="completed"&&t.due_at&&new Date(t.due_at)<new Date())}
function isDueToday(t){if(!t||t.status==="completed"||!t.due_at)return false;const {start,end}=localDayBounds(),d=new Date(t.due_at);return d>=start&&d<=end}
function isFollowUpDue(t){if(!t||t.status!=="waiting"||!t.follow_up_at)return false;const {end}=localDayBounds();return new Date(t.follow_up_at)<=end}
function attentionScore(t){let n=0;if(t.priority==="urgent")n+=100;if(isOverdue(t))n+=80;if(isDueToday(t))n+=45;if(isFollowUpDue(t))n+=40;if(t.status==="new")n+=25;if(t.status==="waiting")n+=10;return n}
function byAttention(arr){return arr.slice().sort((a,b)=>attentionScore(b)-attentionScore(a)||new Date(b.created_at)-new Date(a.created_at))}

function home(){
  const open=activeTickets(),urgent=open.filter(t=>t.priority==="urgent").length,overdue=open.filter(isOverdue).length,criticalCount=open.filter(t=>t.priority==="urgent"||isOverdue(t)).length;
  const dueToday=open.filter(isDueToday),follow=open.filter(isFollowUpDue),critical=byAttention(open.filter(t=>t.priority==="urgent"||isOverdue(t))),fresh=byAttention(open.filter(t=>t.status==="new"));
  const section=(title,arr,empty)=>'<div class="sectionTitle"><span>'+title+'</span><span class="count">'+arr.length+'</span></div>'+(arr.length?arr.slice(0,6).map(ticketCard).join(""):'<div class="miniEmpty">'+empty+'</div>');
  return '<div class="screen"><div class="top"><div class="headrow"><div><div class="brand">Hanok HQ</div><div class="tagline">TODAY · GROUP OPERATIONS</div></div><div class="row"><button class="iconBtn" onclick="refreshAll()">↻</button><button class="iconBtn" onclick="page=\'profile\';render()">◉</button></div></div><div class="greet">Good '+(new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening")+', '+escapeHtml(profile.display_name||"Daniel")+'</div><div class="sub"><span class="sync"><i></i> Connected · auto-sync every 12s</span></div><div class="stats"><div class="stat red"><b>'+criticalCount+'</b><small>Critical</small></div><div class="stat blue"><b>'+dueToday.length+'</b><small>Due Today</small></div><div class="stat gold"><b>'+follow.length+'</b><small>Follow-ups</small></div></div></div><main class="content"><div class="captureBox"><textarea id="homeCapture" placeholder="Type anything you need to remember… e.g. Woden back door waiting for Westfield tomorrow"></textarea><div class="captureActions"><button class="voicePulse" onclick="startVoiceCapture()">●</button><button class="captureGo" onclick="quickCapture(document.getElementById(\'homeCapture\').value)">Capture to Inbox</button></div><div class="captureHint">Voice or text → store, category, priority and due date are suggested automatically.</div></div>'+section("Critical Now",critical,"Nothing critical right now.")+section("Due Today",dueToday.filter(t=>!isOverdue(t)),"No tickets due today.")+section("Follow-ups",follow,"No follow-ups due today.")+section("New & Unassigned",fresh,"No new tickets waiting.")+'</main><button class="fab" onclick="quickCapture()">+</button>'+nav()+'</div>'
}
function ticketList(){
  let arr=tickets;
  if(filter==="active")arr=arr.filter(t=>t.status!=="completed");
  if(filter==="today")arr=arr.filter(isDueToday);
  if(filter==="overdue")arr=arr.filter(isOverdue);
  if(filter==="urgent")arr=arr.filter(t=>t.priority==="urgent"&&t.status!=="completed");
  if(filter==="waiting")arr=arr.filter(t=>t.status==="waiting");
  if(filter==="completed")arr=arr.filter(t=>t.status==="completed");
  if(filter!=="completed")arr=byAttention(arr);
  return '<div class="screen"><div class="pageHead"><h1>Tickets</h1><button onclick="newTicket()">＋</button></div><div class="filters">'+["active","today","overdue","urgent","waiting","completed"].map(f=>'<button class="'+(filter===f?"active":"")+'" onclick="filter=\''+f+'\';render()">'+(f==="today"?"Today":f[0].toUpperCase()+f.slice(1))+'</button>').join("")+'</div><main class="content" style="padding-top:7px">'+(arr.length?arr.map(ticketCard).join(""):'<div class="empty">Nothing here.</div>')+'</main>'+nav()+'</div>'

function detectStoreFromText(text){
  const q=text.toLowerCase(),aliases=[
    ["woden","woden"],["沃登","woden"],["wagga","wagga"],["瓦嘎","wagga"],["pandan","pandan"],["班兰","pandan"],
    ["meathouse","meathouse"],["meat house","meathouse"],["肉屋","meathouse"],["bbqtown dickson","bbqtown dickson"],["bbq town dickson","bbqtown dickson"],["dickson","dickson"],["迪克森","dickson"]
  ];
  for(const [a,b] of aliases){if(q.includes(a)){const s=stores.find(x=>x.name.toLowerCase().includes(b));if(s)return s.id}}
  return null
}
function detectCategory(text){
  const q=text.toLowerCase();
  const rules=[
    ["Maintenance",/broken|repair|leak|door|fridge|freezer|duct|hood|hinge|light|electric|plumb|water|坏|漏水|维修|门|冰箱|烟道|电/],
    ["Supplier / Stock",/stock|supplier|order|beef|meat|pork|oyster|skirt|short rib|库存|订货|牛肉|猪肉|供应商/],
    ["IT / POS",/pos|printer|internet|wifi|tablet|app|system|电脑|打印机|网络|系统/],
    ["Marketing",/google|instagram|reel|poster|menu|marketing|review|海报|菜单|宣传|谷歌/],
    ["HR / Staff",/staff|roster|employee|training|manager|shift|员工|排班|培训|经理/],
    ["Finance",/invoice|payment|balance|rent|remittance|finance|发票|付款|余额|租金/],
    ["Landlord / Centre",/landlord|westfield|centre|lease|property|agent|房东|物业|租约|中介/],
    ["Health & Safety",/health|food safety|cleaning|chemical|inspection|安全|卫生|清洁|检查/]
  ];
  for(const [cat,re] of rules)if(re.test(q))return cat;
  return "Other"
}
function suggestedDue(text){
  const q=text.toLowerCase(),d=new Date();
  const setHour=()=>{d.setHours(17,0,0,0);if(d<new Date())d.setHours(new Date().getHours()+2,0,0,0)};
  if(/tomorrow|明天/.test(q)){d.setDate(d.getDate()+1);d.setHours(17,0,0,0);return d}
  if(/today|今天/.test(q)){setHour();return d}
  const names=[["sunday",0],["monday",1],["tuesday",2],["wednesday",3],["thursday",4],["friday",5],["saturday",6]];
  for(const [name,day] of names){if(q.includes(name)){let add=(day-d.getDay()+7)%7;if(add===0)add=7;d.setDate(d.getDate()+add);d.setHours(17,0,0,0);return d}}
  return null
}
function captureTitle(text){
  let x=text.trim().replace(/\s+/g," ");const cut=x.search(/[.!?。！？]/);if(cut>8)x=x.slice(0,cut);return x.length>80?x.slice(0,77)+"…":x
}

async function openTicket(id){
  const t=tickets.find(x=>x.id===id);if(!t)return;
  detail.className="overlay show";detail.innerHTML='<div class="detailTop"><button onclick="closeDetail()">‹</button><b>Ticket Detail</b><button>⋮</button></div><div class="sheet"><div class="detailCard"><div class="row between"><div class="row"><span class="pill '+(t.priority==="urgent"?"red":statusClass(t.status))+'">'+(t.priority==="urgent"?"Urgent":statusLabel(t.status))+'</span><span class="store">'+ticketId(t)+'</span></div><span class="pill '+statusClass(t.status)+'">'+statusLabel(t.status)+'</span></div><h2>'+escapeHtml(t.title)+'</h2><div class="store">▦ '+escapeHtml(storeFor(t.store_id).name)+'</div><p class="desc">'+escapeHtml(t.description||"No description.")+'</p><div class="meta"><div><b>Category</b><br>'+escapeHtml(t.category)+'</div><div><b>Reported by</b><br>'+escapeHtml(t.reported_by||"—")+'</div><div><b>Due</b><br>'+fmtDate(t.due_at)+'</div><div><b>Created</b><br>'+fmtDate(t.created_at)+'</div></div><div id="attachmentsWrap"><b>Attachments</b><div id="attachments" class="attachments"><div class="empty" style="padding:12px">Loading…</div></div></div><div id="reopenWrap"></div><div id="timeline" class="timeline"><b>Timeline</b><div class="empty" style="padding:18px">Loading…</div></div><div id="comments"><b>Comments</b><div class="empty" style="padding:18px">Loading…</div></div><div class="form"><label>Add comment</label><textarea id="commentBody" placeholder="Add an update..."></textarea><button class="secondary" onclick="addComment(\''+t.id+'\')">Post comment</button></div></div></div>'+(isHQ()&&t.status!=="completed"?'<div class="actions"><button onclick="'+(t.status==="new"?'acceptTicket': 'startTicket')+'(\''+t.id+'\')">'+(t.status==="new"?'✓ Accept':'▶ Start Work')+'</button><button onclick="waitingForm(\''+t.id+'\')">◷ Waiting</button><button class="complete" onclick="completeForm(\''+t.id+'\')">✓ Complete</button></div>':'');
  try{
    const [ev,co,at,rr]=await Promise.all([loadEvents(id),loadComments(id),api("/rest/v1/ops_ticket_attachments?ticket_id=eq."+id+"&select=id,storage_path,file_name,mime_type,created_at&order=created_at.asc"),api("/rest/v1/ops_reopen_requests?ticket_id=eq."+id+"&select=id,reason,status,created_at,reviewed_at&order=created_at.desc")]);
    document.getElementById("timeline").innerHTML='<b>Timeline</b>'+(ev.length?ev.map(e=>'<div class="tl"><i></i><div><strong>'+escapeHtml(e.message||e.event_type)+'</strong><span>'+escapeHtml(e.event_type.replaceAll("_"," "))+'</span></div><span>'+fmtDate(e.created_at)+'</span></div>').join(""):'<div class="empty" style="padding:18px">No events yet.</div>');
    document.getElementById("comments").innerHTML='<b>Comments</b>'+(co.length?co.map(c=>'<div class="comment"><b>'+fmtDate(c.created_at)+'</b><p>'+escapeHtml(c.body)+'</p></div>').join(""):'<div class="empty" style="padding:18px">No comments yet.</div>');
    await renderAttachments(at||[]);renderReopenRequests(id,rr||[]);
  }catch(e){toast(e.message)}
}
function closeDetail(){detail.className="overlay";detail.innerHTML=""}
async function openNotification(notificationId,ticketId){try{await api("/rest/v1/ops_notifications?id=eq."+notificationId,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({read_at:new Date().toISOString()})});const n=notifications.find(x=>x.id===notificationId);if(n)n.read_at=new Date().toISOString();if(ticketId)openTicket(ticketId);else render()}catch(e){toast(e.message)}}
async function renderAttachments(list){const box=document.getElementById("attachments");if(!box)return;if(!list.length){box.innerHTML='<div style="font-size:11px;color:#8c969e">No attachments.</div>';return}box.innerHTML="";for(const a of list){const el=document.createElement("div");el.className="attachment";if((a.mime_type||"").startsWith("image/")){el.innerHTML='<button>Loading image…</button>';try{const r=await fetch(SB_URL+"/storage/v1/object/authenticated/ops-ticket-attachments/"+encodeURI(a.storage_path),{headers:authHeaders()});if(!r.ok)throw 0;const b=await r.blob(),u=URL.createObjectURL(b);el.innerHTML='<img alt="'+escapeHtml(a.file_name)+'">';el.querySelector("img").src=u;el.onclick=()=>window.open(u,"_blank")}catch{el.innerHTML='<button>Could not load image</button>'}}else{el.innerHTML='<button>▶ '+escapeHtml(a.file_name)+'</button>';el.onclick=()=>openAttachment(a)}box.appendChild(el)}}
async function openAttachment(a){showLoading(true);try{const r=await fetch(SB_URL+"/storage/v1/object/authenticated/ops-ticket-attachments/"+encodeURI(a.storage_path),{headers:authHeaders()});if(!r.ok)throw new Error("Could not open attachment");const b=await r.blob(),u=URL.createObjectURL(b);window.open(u,"_blank")}catch(e){toast(e.message)}finally{showLoading(false)}}
function renderReopenRequests(ticketId,list){const box=document.getElementById("reopenWrap");if(!box)return;const pending=list.find(x=>x.status==="pending");if(!pending){box.innerHTML="";return}box.innerHTML='<div class="reopenCard"><b>Store requested reopen</b><p>'+escapeHtml(pending.reason)+'</p><div class="reopenActions"><button onclick="reviewReopen(\''+pending.id+'\',false,\''+ticketId+'\')">Reject</button><button class="approve" onclick="reviewReopen(\''+pending.id+'\',true,\''+ticketId+'\')">Approve & Reopen</button></div></div>'}
async function reviewReopen(requestId,approve,ticketId){showLoading(true);try{await api("/rest/v1/rpc/ops_review_reopen_request",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({p_request_id:requestId,p_approve:approve})});await Promise.all([loadTickets(true),loadNotifications(true)]);await openTicket(ticketId);toast(approve?"Ticket reopened":"Request rejected")}catch(e){toast(e.message)}finally{showLoading(false)}}

async function startTicket(id){showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"in_progress"})});await loadTickets(true);await openTicket(id);toast("Work started")}catch(e){toast(e.message)}finally{showLoading(false)}}
async function acceptTicket(id){
  showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"accepted"})});await loadTickets(true);closeDetail();render();toast("Ticket accepted")}catch(e){toast(e.message)}finally{showLoading(false)}
}
function waitingForm(id){
  detail.innerHTML='<div class="detailTop"><button onclick="openTicket(\''+id+'\')">‹</button><b>Set Follow-up</b><button></button></div><div class="sheet form"><div class="detailCard"><label>Waiting for</label><select id="waitReason"><option>Supplier</option><option>Landlord</option><option>Contractor</option><option>Staff</option><option>Centre Management</option><option>Other</option></select><label>Follow-up date & time</label><input id="followAt" type="datetime-local"><label>Notes</label><textarea id="waitNote" placeholder="What are we waiting for?"></textarea><button class="primary" onclick="saveWaiting(\''+id+'\')">Save Follow-up</button></div></div>'
}
async function saveWaiting(id){
  const dt=document.getElementById("followAt").value;if(!dt){toast("Choose a follow-up time");return}
  const reason=document.getElementById("waitReason").value+(document.getElementById("waitNote").value.trim()?" · "+document.getElementById("waitNote").value.trim():"");
  showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"waiting",waiting_reason:reason,follow_up_at:new Date(dt).toISOString()})});await loadTickets(true);closeDetail();render();toast("Follow-up saved")}catch(e){toast(e.message)}finally{showLoading(false)}
}
function completeForm(id){
  detail.innerHTML='<div class="detailTop"><button onclick="openTicket(\''+id+'\')">‹</button><b>Complete Ticket</b><button></button></div><div class="sheet form"><div class="detailCard"><label>Resolution</label><textarea id="resolution" placeholder="What was done to resolve this issue?"></textarea><button class="primary" onclick="completeTicket(\''+id+'\')">Complete Ticket</button></div></div>'
}
async function completeTicket(id){
  const resolution=document.getElementById("resolution").value.trim();if(!resolution){toast("Add a resolution note");return}
  showLoading(true);try{await api("/rest/v1/ops_tickets?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:"completed",resolution})});await loadTickets(true);closeDetail();render();toast("Ticket completed")}catch(e){toast(e.message)}finally{showLoading(false)}
}
async function addComment(id){
  const body=document.getElementById("commentBody").value.trim();if(!body)return;
  showLoading(true);try{await api("/rest/v1/ops_ticket_comments",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({ticket_id:id,author_id:session.user.id,body})});await openTicket(id);toast("Comment added")}catch(e){toast(e.message)}finally{showLoading(false)}
}

function newTicket(defaultStoreId=null,seedTitle="",seedDesc=""){
  const storeSelect=isHQ()?'<label>Store</label><select id="newStore">'+stores.map(s=>'<option value="'+s.id+'" '+(defaultStoreId===s.id?"selected":"")+'>'+escapeHtml(s.name)+'</option>').join("")+'</select>':'';
  detail.className="overlay show";detail.innerHTML='<div class="detailTop"><button onclick="closeDetail()">‹</button><b>New Ticket</b><button></button></div><div class="sheet form"><div class="detailCard">'+storeSelect+'<label>Title</label><input id="newTitle" placeholder="What needs attention?" value="'+escapeHtml(seedTitle)+'"><label>Description</label><textarea id="newDesc" placeholder="Describe the issue">'+escapeHtml(seedDesc)+'</textarea><label>Category</label><select id="newCat">'+["Maintenance","Supplier / Stock","IT / POS","Marketing","HR / Staff","Finance","Landlord / Centre","Health & Safety","Other"].map(x=>'<option>'+x+'</option>').join("")+'</select><label>Priority</label><select id="newPri"><option value="normal">Normal</option><option value="urgent">Urgent</option></select><label>Due date (optional)</label><input id="newDue" type="datetime-local"><label>Photo / video (optional)</label><input id="newFile" type="file" accept="image/*,video/*"><button class="primary" onclick="createTicket()">Submit to HQ</button></div></div>'
}
async function uploadAttachment(ticketId,file){
  if(!file)return;
  const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=ticketId+"/"+Date.now()+"_"+clean;
  const r=await fetch(SB_URL+"/storage/v1/object/ops-ticket-attachments/"+encodeURI(path),{method:"POST",headers:{...authHeaders({"Content-Type":file.type||"application/octet-stream","x-upsert":"false"})},body:file});
  if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.message||"Attachment upload failed")}
  await api("/rest/v1/ops_ticket_attachments",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({ticket_id:ticketId,uploaded_by:session.user.id,storage_path:path,file_name:file.name,mime_type:file.type,size_bytes:file.size})});
}
async function createTicket(){
  const title=document.getElementById("newTitle").value.trim();if(!title){toast("Add a title");return}
  const storeId=isHQ()?document.getElementById("newStore").value:profile.store_id;if(!storeId){toast("Your account has no store assigned");return}
  const due=document.getElementById("newDue").value,file=document.getElementById("newFile").files[0];
  const payload={store_id:storeId,created_by:session.user.id,title,description:document.getElementById("newDesc").value.trim(),category:document.getElementById("newCat").value,priority:document.getElementById("newPri").value,due_at:due?new Date(due).toISOString():null};
  showLoading(true);try{
    const created=await api("/rest/v1/ops_tickets",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(payload)});
    if(file&&created&&created[0])await uploadAttachment(created[0].id,file);
    await loadTickets(true);closeDetail();page="tickets";render();toast("Ticket created");
  }catch(e){toast(e.message)}finally{showLoading(false)}
}

if(session)boot();else showLogin();
</script></body></html>
