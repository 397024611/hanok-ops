plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanokgroup.ops'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hanokgroup.ops'
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName '0.10.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storeType 'PKCS12'
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.assets.srcDirs = ["../../mobile-dist"]
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Package the generated entry/HQ/store bundle together; never fall back to old HQ-only assets.
tasks.register('prepareMobileAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build-mobile.cjs'
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareMobileAssets')
}
