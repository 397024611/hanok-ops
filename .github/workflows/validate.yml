name: Validate report workflows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mocked-browser:
    name: Mocked browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [hq, account-management, store-portal, store-accounts]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - name: Install pinned Playwright and its Chromium
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run isolated mocked browser suite
        shell: bash
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          mkdir -p tests/artifacts
          python -u "tests/${BROWSER_SUITE}-browser.py" 2>&1 | tee "tests/artifacts/${BROWSER_SUITE}-browser.log"
      - name: Preserve mocked screenshots and test logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocked-browser-${{ matrix.suite }}
          path: |
            tests/artifacts/*.png
            tests/artifacts/*-browser.log
          if-no-files-found: ignore
          retention-days: 7
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android and lint without production signing secrets
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Preserve Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
