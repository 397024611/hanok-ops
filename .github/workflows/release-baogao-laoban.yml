name: Build signed Report Boss APK

on:
  push:
    branches: [main, codex/report-boss-v0.8.4-login-hotfix]
  workflow_dispatch:

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ../.signing/baogao-laoban-release.p12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify application flows
        run: npm ci --ignore-scripts && npm run check && npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required repository secret: $key. Add the approved release signing identity before building."
              exit 1
            fi
          done
          install -d -m 700 android/.signing
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > android/.signing/baogao-laoban-release.p12
          chmod 600 android/.signing/baogao-laoban-release.p12

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify signed APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          node scripts/verify-apk-certificate.cjs signature.txt fd9dcc1f8ddcc0a600e93cc0ebfb17ad53b98eac23df06a8f0b828b3bf5e6a4f
          "$ZIPALIGN" -c 4 "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "package: name='com.hanokgroup.ops' versionCode='12' versionName='0.8.4'" apk-badging.txt
          grep -Fq "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" apk-badging.txt
          if grep -q 'application-debuggable' apk-badging.txt; then
            echo "::error::Release APK must not be debuggable"
            exit 1
          fi
          sha256sum "$APK" | tee Baogao-Laoban-Release.sha256
          cp "$APK" Baogao-Laoban-Release.apk

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -o "versionName '[^']*'" android/app/build.gradle | head -1 | cut -d"'" -f2)"
          VERSION_CODE="$(grep -o "versionCode [0-9]*" android/app/build.gradle | head -1 | awk '{print $2}')"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baogao-Laoban-v${{ steps.version.outputs.name }}
          path: |
            Baogao-Laoban-Release.apk
            Baogao-Laoban-Release.sha256
            signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f android/.signing/baogao-laoban-release.p12
