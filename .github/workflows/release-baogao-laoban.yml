name: Release Baogao Laoban APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ../.signing/baogao-laoban-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p android/.signing
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n' | base64 --decode > android/.signing/baogao-laoban-release.jks
          chmod 600 android/.signing/baogao-laoban-release.jks

      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "Signer #1 certificate SHA-256 digest: fb8caef222501c812fa49dbb18e173af3a86b71cc37a2f9e3f8e0061e5bbcf57" signature.txt
          sha256sum "$APK" | tee Baogao-Laoban-Release.sha256
          cp "$APK" Baogao-Laoban-Release.apk

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -o "versionName '[^']*'" android/app/build.gradle | head -1 | cut -d"'" -f2)"
          VERSION_CODE="$(grep -o "versionCode [0-9]*" android/app/build.gradle | head -1 | awk '{print $2}')"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baogao-Laoban-v${{ steps.version.outputs.name }}
          path: |
            Baogao-Laoban-Release.apk
            Baogao-Laoban-Release.sha256
            signature.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Baogao-Laoban-Release.apk Baogao-Laoban-Release.sha256 signature.txt --clobber
          else
            gh release create "$TAG" \
              Baogao-Laoban-Release.apk \
              Baogao-Laoban-Release.sha256 \
              signature.txt \
              --target "$GITHUB_SHA" \
              --title "报告老板 $TAG" \
              --generate-notes
          fi
